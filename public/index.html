<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULSE by REYLEX | Maintenance Operations</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="theme-color" content="#12233a"><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap');
:root{font:14px 'DM Sans',Arial,sans-serif;--nav:#12233a;--bg:#f3f6fa;--card:#fff;--ink:#19283e;--muted:#718095;--line:#e2e8f0;--blue:#226be2;--soft:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}h1,h2,h3{font-family:Manrope,Arial,sans-serif;margin:0}h1{font-size:30px;letter-spacing:-1px}h2{font-size:17px}p{color:var(--muted)}.hidden{display:none!important}.app{display:flex;min-height:100vh}.sidebar{width:247px;background:var(--nav);color:white;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:25px 14px}.logo{font:800 27px Manrope;letter-spacing:2px;padding:5px 15px 24px}.logo span{color:#66a7ff}.logo small{display:block;font:700 9px DM Sans;letter-spacing:2px;color:#819ab7;margin-top:4px}.nav-label{color:#7690ae;letter-spacing:2px;font-size:10px;font-weight:800;margin:18px 12px 8px}.nav{width:100%;text-align:left;border:0;border-radius:9px;background:transparent;color:#b9c9d9;padding:13px;display:flex;gap:12px;align-items:center;margin:2px 0;font-weight:700;font-size:12px}.nav:hover,.nav.active{background:#244a72;color:#fff}.nav.active{box-shadow:inset 3px 0 #67b3ff}.sidefoot{margin-top:auto;border-top:1px solid #31435b;padding:16px 10px;font-size:12px;color:#b7c9dc}.main{min-width:0;flex:1}.topbar{height:75px;background:var(--card);border-bottom:1px solid var(--line);padding:0 34px;display:flex;align-items:center;justify-content:space-between;gap:12px}.content{padding:34px;max-width:1510px;margin:auto}.eyebrow{font-size:10px;color:#3b79c7;letter-spacing:2px;font-weight:800;text-transform:uppercase}.head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:8px 0 25px}.head p{margin:7px 0 0}.btn{background:var(--blue);border:1px solid var(--blue);color:#fff;border-radius:9px;padding:11px 16px;font-size:12px;font-weight:800}.btn.secondary{background:var(--card);color:var(--ink);border-color:var(--line)}.btn.danger{background:#ad3c4a;border-color:#ad3c4a}.pill{font-size:11px;font-weight:700;background:#eaf2ff;color:#2266ba;border-radius:20px;padding:5px 9px;white-space:nowrap}.pill.warn{background:#fff1dc;color:#98601b}.pill.danger{background:#ffe8eb;color:#b73d52}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 16px #10223806}.card{padding:22px}.card .num{font:800 31px Manrope;margin:12px 0 5px}.muted{color:var(--muted)}.tiny{font-size:11px}.two{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-top:18px}.panel{padding:23px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row strong{display:block;font-size:13px}.row small{color:var(--muted);display:block;margin-top:5px}.tablewrap{overflow-x:auto}.data{width:100%;border-collapse:collapse;font-size:12px}.data th{text-align:left;color:var(--muted);font-weight:800;border-bottom:1px solid var(--line);padding:13px 11px}.data td{border-bottom:1px solid var(--line);padding:15px 11px}.data tr:hover td{background:var(--soft)}.click{cursor:pointer}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{max-width:260px}.field label{display:block;color:#52647c;font-weight:800;font-size:11px;margin:0 0 7px}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:11px 12px;background:var(--card);border:1px solid #d6e0ea;border-radius:9px;color:var(--ink);outline-color:#7eaeed}.field textarea{min-height:112px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.field.full{grid-column:1/-1}.formsection{padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}.formsection h2{margin-bottom:6px}.formsection p{margin:0 0 22px;font-size:12px}.formfooter{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.setting{padding:21px;border:1px solid var(--line);background:var(--card);border-radius:12px}.setting h3{font-size:14px}.setting p{font-size:12px}.switchrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.switchrow input{width:17px}.overlay{position:fixed;inset:0;background:#07162990;z-index:20;display:flex;justify-content:flex-end}.drawer{height:100%;overflow:auto;background:var(--card);width:min(600px,100%);padding:32px;box-shadow:-10px 0 40px #0002}.toast{position:fixed;bottom:24px;right:24px;z-index:30;background:#1a2e48;color:white;padding:15px 20px;border-radius:10px;max-width:400px;box-shadow:0 12px 32px #0003}.auth{max-width:430px;margin:8vh auto;padding:36px}.auth h1{margin-bottom:10px}.auth .field{margin:16px 0}.dark{--bg:#101a29;--card:#1b2a3d;--ink:#edf4ff;--muted:#a4b6cc;--line:#34465b;--soft:#23354a}.dark .field input,.dark .field select,.dark .field textarea{background:#21344b;color:white;border-color:#3d526b}.compact .row{padding:8px 0}.compact .data td{padding:8px}.spacious .row{padding:20px 0}.spacious .data td{padding:20px}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.settings{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.app{display:block}.sidebar{width:100%;height:auto;position:relative;padding:12px;display:block}.logo{padding:4px}.nav-label,.sidefoot{display:none}.nav{display:inline-flex;width:auto;padding:9px;margin:3px;font-size:11px}.topbar{padding:12px;height:auto}.content{padding:18px}.cards,.settings,.formgrid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}h1{font-size:24px}}
.pulse-bars{display:grid;gap:10px}.pulse-bar-row{display:grid;grid-template-columns:110px 1fr 25px;gap:12px;align-items:center}.pulse-track{background:#e8eef7;height:12px;border-radius:8px;overflow:hidden}.pulse-track div{background:#327bdc;height:100%;border-radius:8px}.pulse-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.pulse-day{min-height:95px;border:1px solid #e2e8f0;padding:6px;min-width:0}.pulse-day-head{text-align:center;font-weight:700;padding:8px;background:#edf2f8}.pulse-event{background:#dceafe;border-left:3px solid #327bdc;border-radius:3px;padding:3px;font-size:11px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pulse-article{padding:13px;border-bottom:1px solid #e2e8f0}.pulse-article summary{cursor:pointer;font-weight:700}.pulse-article small{display:block;color:#718095;font-weight:400}@media(max-width:700px){.pulse-day{min-height:65px;padding:2px}.pulse-event{font-size:9px}.pulse-bar-row{grid-template-columns:90px 1fr 20px}}
.site-picker{display:flex;align-items:center;gap:11px;border:1px solid #d8e2ef;border-radius:12px;background:linear-gradient(135deg,#fff,#f0f6ff);padding:9px 12px;box-shadow:0 3px 12px #14294b0c;min-width:210px}.site-pin{display:grid;place-items:center;width:33px;height:33px;border-radius:9px;background:#dceaff;color:#1c65c4;font-size:23px}.site-picker-text{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.site-picker-text small{font-size:9px;letter-spacing:1px;color:#6a7f9b;font-weight:800}.site-picker select{width:100%;max-width:230px;border:0;outline:none;background:transparent;font-weight:800;color:#1d3555;appearance:none;cursor:pointer}.site-chevron{color:#527296;font-size:18px}.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px}.chart-round{width:175px;height:175px;border-radius:50%;margin:12px auto;display:grid;place-items:center}.chart-round span{background:white;border-radius:50%;height:105px;width:105px;display:grid;place-items:center;font-size:24px;font-weight:800}.chart-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:11px;color:var(--muted)}.chart-legend span{display:flex;align-items:center;gap:5px}.chart-legend i{width:9px;height:9px;border-radius:3px;display:inline-block}.chart-line{width:100%;max-height:200px}.ticket-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 0;width:100%;text-align:left;color:var(--ink)}.ticket-item:hover{background:var(--soft)}.ticket-item small{display:block;color:var(--muted);margin-top:5px}@media(max-width:700px){.site-picker{min-width:0}.site-picker-text small{display:none}.topbar{flex-wrap:wrap}}
</style></head><body><div id="root"></div><div id="toast" class="toast hidden"></div><script>
const root=document.getElementById('root');const labels={dashboard:'Command Center',orders:'Work Orders',pm:'Preventive Maintenance',planner:'Maintenance Planner',assets:'Assets',requests:'Maintenance Requests',reports:'Report Builder',calendar:'Calendar',support:'Support Center',migration:'Migration Studio',settings:'Settings'};const icons={dashboard:'◈',orders:'▤',pm:'◷',planner:'▦',assets:'⬡',requests:'✉',reports:'▥',calendar:'▦',support:'✚',migration:'⇄',settings:'⚙'};let user=null,page='dashboard',data={},settings={visible:Object.keys(labels).filter(x=>x!=='settings'),widgets:['metrics','attention','schedule','assets']},prefs={theme:'hybrid',density:'comfortable',accent:'blue'},filterSite='',detail=null,reportSource='orders';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>s?new Date(s).toLocaleDateString(): '—';const pill=s=>`<span class="pill ${/Overdue|Critical|Hold/.test(s)?'danger':/High|Progress|Due/.test(s)?'warn':''}">${esc(s||'New')}</span>`;
async function api(path,opts={}){const r=await fetch('/api/'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});const v=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(v.error||`Request failed (${r.status})`);return v}const post=(path,v,method='POST')=>api(path,{method,body:JSON.stringify(v)});function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),4300)}function applyPrefs(){document.body.classList.toggle('dark',prefs.theme==='dark');document.body.classList.toggle('compact',prefs.density==='compact');document.body.classList.toggle('spacious',prefs.density==='spacious')}
async function init(){try{const me=await api('me');user=me.user;const [a,b]=await Promise.allSettled([api('workspace'),api('preferences')]);if(a.status==='fulfilled')settings={...settings,...a.value.settings};if(b.status==='fulfilled')prefs=b.value.preferences;applyPrefs();await refresh();render()}catch{await auth()}}
async function auth(){let setup=false;try{setup=(await api('setup-status')).needsSetup}catch{}root.innerHTML=`<div class="auth panel"><div class="logo" style="color:#19283e">PULSE<span>.</span><small>by REYLEX</small></div><h1>${setup?'Set up PULSE':'Welcome back'}</h1><p>${setup?'Create the first administrator':'Sign in to your maintenance workspace'}</p><form id="authForm">${setup?'<div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div>':''}<div class="field"><label>Company ID</label><input name="company_id" value="pulse-demo" required></div><div class="field"><label>Username</label><input name="username" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn" style="width:100%">${setup?'Create administrator':'Sign in'}</button></form></div>`;document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{if(setup){await post('setup',b);toast('Administrator created. Please sign in.');await auth()}else{await post('login',b);await init()}}catch(err){toast(err.message)}}}
async function refresh(){const paths=['orders','pm','assets','sites','users/assignable','audit','reports','support/tickets','support/articles'];await Promise.all(paths.map(async p=>{try{data[p]=(await api(p))}catch(e){data[p]={error:e.message};console.warn(p,e.message)}}))}
function nav(){return Object.keys(labels).filter(k=>k==='settings'||(['calendar','support','migration'].includes(k)||settings.visible?.includes(k))).map(k=>`<button class="nav ${page===k?'active':''}" onclick="go('${k}')"><span>${icons[k]||'•'}</span>${labels[k]}</button>`).join('')}
function render(){if(!user)return;root.innerHTML=`<div class="app"><aside class="sidebar"><div class="logo">PULSE<span>.</span><small>by REYLEX</small></div><div class="nav-label">MAINTENANCE OPERATIONS</div>${nav()}<div class="sidefoot"><strong>${esc(user.name)}</strong><br>${esc(user.role)} · ${esc(user.company_id)}</div></aside><div class="main"><header class="topbar"><span class="muted tiny">PULSE / <strong>${labels[page]}</strong></span><div style="display:flex;gap:10px;align-items:center"><div class="site-picker"><span class="site-pin">⌖</span><div class="site-picker-text"><small>ACTIVE FACILITY</small><select class="site" aria-label="Select active facility" onchange="filterSite=this.value;render()"><option value="">All authorized sites</option>${(data.sites?.sites||[]).map(s=>`<option value="${esc(s.id)}" ${filterSite===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><span class="site-chevron">⌄</span></div><button class="btn secondary" type="button" id="openSetup">Setup Guide</button><button class="btn secondary" onclick="signout()">Sign out</button></div></header><main class="content"><div class="eyebrow">MAINTENANCE OPERATIONS / ${labels[page].toUpperCase()}</div><div class="head"><div><h1>${labels[page]}</h1><p>${subhead()}</p></div>${['orders','pm','assets'].includes(page)?`<button class="btn" data-create="${page}" type="button">＋ Create ${page==='orders'?'Work Order':page==='pm'?'PM Schedule':'Asset'}</button>`:''}</div><div id="workspace">${content()}</div></main></div></div>`}
function subhead(){return {dashboard:'Your operational picture, priorities and upcoming work.',orders:'Plan, assign and track maintenance execution.',pm:'Manage recurring maintenance and generated work orders.',planner:'Coordinate upcoming preventive and corrective work.',assets:'Equipment records, condition and service history.',requests:'Requests submitted from the maintenance intake portal.',reports:'Build and save reports from your live maintenance data.',settings:'Personalize PULSE and administer your organization.',support:'Find answers and track your support requests.',calendar:'See upcoming maintenance activity.',migration:'Prepare legacy maintenance data.'}[page]}
function scoped(rows){return (rows||[]).filter(r=>!filterSite||r.site_id===filterSite)}const orders=()=>scoped(data.orders?.orders),pms=()=>scoped(data.pm?.pm),assets=()=>scoped(data.assets?.assets);const cell=(a,b)=>`<div><strong>${esc(a)}</strong><small>${esc(b)}</small></div>`;const empty=t=>`<div class="empty">${esc(t)}</div>`;
function content(){if(page==='calendar')return calendarPage();if(page==='support')return supportPage();if(page==='migration')return migrationPage();if(page==='dashboard')return dashboard();if(page==='orders')return orderList();if(page==='pm')return pmList();if(page==='planner')return planner();if(page==='assets')return assetList();if(page==='requests')return requestList();if(page==='reports')return reports();return settingPage()}
function dashboard(){const w=settings.widgets||[];const o=orders(),p=pms(),a=assets(),open=o.filter(x=>!['Closed','Completed'].includes(x.status)),due=p.filter(x=>x.enabled&&x.next_due<=new Date().toISOString().slice(0,10));return `${settings.charts?dashboardCharts(o,p):''}${w.includes('metrics')?`<div class="cards">${[['Open Work Orders',open.length,'Active maintenance workload'],['PMs Due / Overdue',due.length,'Scheduled maintenance'],['Registered Assets',a.length,'Equipment under management'],['Critical Work',open.filter(x=>x.priority==='Critical').length,'Requires immediate review']].map(x=>`<div class="card"><span class="muted tiny">${x[0]}</span><div class="num">${x[1]}</div><span class="muted tiny">${x[2]}</span></div>`).join('')}</div>`:''}<div class="two">${w.includes('attention')?`<div class="panel"><div class="panelhead"><h2>Attention Queue</h2><span class="pill">Live records</span></div>${[...open.filter(x=>x.priority==='Critical'),...due].slice(0,7).map(x=>`<div class="row click" onclick="detailRecord('${x.asset_code?'pm':'orders'}','${esc(x.id)}')">${cell(x.title,x.asset_code||x.asset||x.id)}${pill(x.asset_code?'PM Due':x.priority)}</div>`).join('')||empty('No urgent work found.')}</div>`:''}${w.includes('schedule')?`<div class="panel"><div class="panelhead"><h2>Upcoming Maintenance</h2><button class="btn secondary" onclick="go('planner')">Open Planner →</button></div>${p.slice().sort((a,b)=>a.next_due.localeCompare(b.next_due)).slice(0,7).map(x=>`<div class="row click" onclick="detailRecord('pm','${esc(x.id)}')">${cell(x.title,x.asset_code)}<span class="muted tiny">${esc(x.next_due)}</span></div>`).join('')||empty('No PM schedules yet.')}</div>`:''}</div>${w.includes('assets')?`<div class="panel" style="margin-top:18px"><div class="panelhead"><h2>Asset Watchlist</h2><button class="btn secondary" onclick="go('assets')">View Assets →</button></div>${a.slice(0,5).map(x=>`<div class="row click" onclick="detailRecord('assets','${esc(x.id)}')">${cell(x.name,x.code)}${pill(x.status||'Operational')}</div>`).join('')||empty('No assets registered yet.')}</div>`:''}`}
function orderList(){return `<div class="panel"><div class="panelhead"><h2>Maintenance Work Orders</h2><span class="muted tiny">${orders().length} records</span></div><div class="tablewrap"><table class="data"><thead><tr><th>WO / Title</th><th>Asset</th><th>Priority</th><th>Status</th><th>Assigned to</th><th>Created</th></tr></thead><tbody>${orders().map(o=>`<tr class="click" onclick="detailRecord('orders','${esc(o.id)}')"><td>${cell(o.title,o.id)}</td><td>${esc(o.asset)}</td><td>${pill(o.priority)}</td><td>${pill(o.status)}</td><td>${esc(assigneeName(o.assigned_to))}</td><td>${fmt(o.created_at)}</td></tr>`).join('')}</tbody></table>${orders().length?'':empty('No work orders found.')}</div></div>`}
function pmList(){return `<div class="panel"><div class="panelhead"><h2>PM Program</h2><span class="muted tiny">${pms().length} schedules</span></div><div class="tablewrap"><table class="data"><thead><tr><th>PM / Asset</th><th>Frequency</th><th>Next Due</th><th>Assignment</th><th>Status</th><th>Action</th></tr></thead><tbody>${pms().map(p=>`<tr><td class="click" onclick="detailRecord('pm','${esc(p.id)}')">${cell(p.title,p.asset_code)}</td><td>Every ${esc(p.schedule_interval)} ${esc(p.schedule_unit)}(s)</td><td>${esc(p.next_due)}</td><td>${esc(assigneeName(p.assigned_to))}</td><td>${pill(p.enabled?'Active':'Paused')}</td><td><button class="btn secondary" onclick="togglePM('${esc(p.id)}',${p.enabled?false:true})">${p.enabled?'Pause':'Activate'}</button></td></tr>`).join('')}</tbody></table>${pms().length?'':empty('No PM schedules created.')}</div></div>`}
function planner(){const p=pms().slice().sort((a,b)=>a.next_due.localeCompare(b.next_due));return `<div class="panel"><div class="panelhead"><h2>Maintenance Timeline</h2><span class="pill">Scheduled PMs</span></div>${p.map(x=>`<div class="row click" onclick="detailRecord('pm','${esc(x.id)}')"><div><strong>${esc(x.title)}</strong><small>${esc(x.asset_code)} · ${esc(assigneeName(x.assigned_to))}</small></div><span class="pill">${esc(x.next_due)}</span></div>`).join('')||empty('Create a PM to populate the maintenance timeline.')}</div>`}
function assetList(){return `<div class="panel"><div class="panelhead"><h2>Asset Registry</h2><span class="muted tiny">${assets().length} assets</span></div><div class="tablewrap"><table class="data"><thead><tr><th>Equipment</th><th>Location</th><th>Manufacturer</th><th>Condition</th></tr></thead><tbody>${assets().map(a=>`<tr class="click" onclick="detailRecord('assets','${esc(a.id)}')"><td>${cell(a.name,a.code)}</td><td>${esc(a.location||a.building||'—')}</td><td>${esc(a.manufacturer||'—')}</td><td>${pill(a.status)}</td></tr>`).join('')}</tbody></table>${assets().length?'':empty('No assets registered.')}</div></div>`}
function requestList(){const o=orders().filter(x=>x.source==='Outside Request');return `<div class="panel"><div class="panelhead"><h2>Maintenance Requests</h2><span class="pill">${o.length} received</span></div>${o.map(x=>`<div class="row click" onclick="detailRecord('orders','${esc(x.id)}')">${cell(x.title,x.requester_name+' · '+x.location)}${pill(x.status)}</div>`).join('')||empty('No outside requests received.')}</div>`}
function assigneeName(id){return (data['users/assignable']?.users||[]).find(x=>x.id===id)?.name||id||'Unassigned'}
function reports(){const src=reportSource,rows=src==='orders'?orders():src==='assets'?assets():pms();return `<div class="two" style="margin-top:0"><div class="panel"><h2>Build a Maintenance Report</h2><p>Explore your live maintenance records.</p><div class="formgrid"><div class="field"><label>Data source</label><select onchange="reportSource=this.value;render()"><option value="orders" ${src==='orders'?'selected':''}>Work Orders</option><option value="pm" ${src==='pm'?'selected':''}>Preventive Maintenance</option><option value="assets" ${src==='assets'?'selected':''}>Assets</option></select></div><div class="field"><label>Report name</label><input id="reportName" placeholder="Monthly maintenance summary"></div></div><div class="formfooter"><button class="btn" onclick="saveReport()">Save Report</button><button class="btn secondary" onclick="exportCSV()">Export CSV</button></div></div><div class="panel"><h2>Saved Reports</h2>${(data.reports?.reports||[]).map(x=>`<div class="row">${cell(x.name,x.source)}<span class="muted tiny">${fmt(x.created_at)}</span></div>`).join('')||empty('No saved reports.')}</div></div><div class="panel" style="margin-top:18px"><div class="panelhead"><h2>Live Preview</h2><span class="pill">${rows.length} records</span></div><div class="tablewrap"><table class="data"><thead><tr>${(src==='orders'?['Title','Status','Priority','Assigned']:src==='assets'?['Code','Name','Status','Location']:['Title','Asset','Next Due','Status']).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,100).map(r=>`<tr>${(src==='orders'?[r.title,r.status,r.priority,assigneeName(r.assigned_to)]:src==='assets'?[r.code,r.name,r.status,r.location]:[r.title,r.asset_code,r.next_due,r.enabled?'Active':'Paused']).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function settingPage(){return `<div class="panel"><h2>Dashboard Charts</h2><p>Enable or disable visual maintenance graphs on your Command Center.</p><label><input id="chartToggle" type="checkbox" ${settings.charts?'checked':''}> Show graphs</label><div class="formgrid" style="margin-top:15px"><div class="field"><label>Chart type</label><select id="chartType">${['bar','line','area','pie','doughnut'].map(x=>`<option value="${x}" ${settings.chartConfigs?.[0]?.type===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></div><div class="field"><label>Graph data</label><select id="chartMetric">${[['wo_status','Work orders by status'],['wo_priority','Work orders by priority'],['wo_site','Work orders by facility'],['pm_state','Preventive maintenance status'],['assets_status','Assets by status']].map(([v,t])=>`<option value="${v}" ${settings.chartConfigs?.[0]?.metric===v?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="formfooter"><button class="btn" onclick="saveChartPreference()">Save Chart Settings</button></div></div><div class="settings">${[['Appearance','Theme and display density','appearance'],['Navigation','Show or hide operational modules','navigation'],['Command Center','Choose your dashboard widgets','widgets'],['Sites & Facilities','Manage company locations','sites'],['Administration','Users, permissions and audit history','admin'],['Migration Studio','Fiix migration and data tools','migration']].map(x=>`<div class="setting"><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn secondary" onclick="settingDetail('${x[2]}')">Configure →</button></div>`).join('')}</div><div id="settingsArea" style="margin-top:20px"></div>`}
function settingDetail(k){const a=document.getElementById('settingsArea');if(k==='appearance')a.innerHTML=`<div class="panel"><h2>Appearance</h2><p>Personalize your workspace.</p><div class="formgrid"><div class="field"><label>Theme</label><select id="theme">${['hybrid','light','dark'].map(v=>`<option ${prefs.theme===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Density</label><select id="density">${['comfortable','compact','spacious'].map(v=>`<option ${prefs.density===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="formfooter"><button class="btn" onclick="savePrefs()">Save Appearance</button></div></div>`;else if(k==='navigation'||k==='widgets'){const vals=k==='navigation'?Object.keys(labels).filter(x=>x!=='settings'):['metrics','attention','schedule','assets'];const selected=k==='navigation'?settings.visible:settings.widgets;a.innerHTML=`<div class="panel"><h2>${k==='navigation'?'Navigation Visibility':'Command Center Widgets'}</h2><p>These are personal display preferences, not security permissions.</p>${vals.map(v=>`<label class="switchrow">${labels[v]||v}<input type="checkbox" data-choice="${v}" ${selected.includes(v)?'checked':''}></label>`).join('')}<div class="formfooter"><button class="btn" onclick="saveLayout('${k}')">Save Workspace</button></div></div>`}else if(k==='sites'){a.innerHTML=`<div class="panel"><h2>Sites & Facilities</h2>${(data.sites?.sites||[]).map(s=>`<div class="row">${cell(s.name,s.code)}<span class="muted">${esc(s.address)}</span></div>`).join('')}<div class="formgrid" style="margin-top:18px"><div class="field"><label>Site name</label><input id="siteName"></div><div class="field"><label>Site code</label><input id="siteCode"></div></div><div class="formfooter"><button class="btn" onclick="createSite()">Create Site</button></div></div>`}else if(k==='admin'){a.innerHTML=`<div class="panel"><h2>Company Administration</h2><p>Current account role: ${esc(user.role)}. Access controls are enforced by the server.</p><h3>Company Users</h3>${(data['users/assignable']?.users||[]).map(x=>`<div class="row">${cell(x.name,x.role)}</div>`).join('')}<h3 style="margin-top:20px">Recent Audit Events</h3>${(data.audit?.events||[]).slice(0,15).map(x=>`<div class="row">${cell(x.action,x.entity_type)}<small>${fmt(x.created_at)}</small></div>`).join('')||empty('No audit events or insufficient permission.')}</div>`}else a.innerHTML=`<div class="panel"><h2>Migration Studio</h2><p>Existing Fiix migration API remains available. The migration interface is not included in this v0.6 candidate; use your previous migration workflow until a validated replacement is available.</p></div>`}
async function savePrefs(){prefs.theme=document.getElementById('theme').value;prefs.density=document.getElementById('density').value;try{await post('preferences',prefs);applyPrefs();toast('Appearance saved')}catch(e){toast(e.message)}}async function saveLayout(k){settings[k==='navigation'?'visible':'widgets']=[...document.querySelectorAll('[data-choice]:checked')].map(x=>x.dataset.choice);try{await post('workspace',settings);toast('Workspace saved');render();settingDetail(k)}catch(e){toast(e.message)}}async function createSite(){try{await post('sites',{name:document.getElementById('siteName').value,code:document.getElementById('siteCode').value});await refresh();render();settingDetail('sites');toast('Site created')}catch(e){toast(e.message)}}
function options(rows,key,label){return `<option value="">Unassigned / Not selected</option>`+(rows||[]).map(r=>`<option value="${esc(r[key])}">${esc(r[label])}</option>`).join('')}

function dashboardCharts(o,p){const choices=settings.chartConfigs?.length?settings.chartConfigs:[{type:'bar',metric:'wo_status',title:'Work Orders by Status'}];return `<div class="chart-grid">${choices.map((cfg,i)=>{let pairs=[];if(cfg.metric==='wo_priority')pairs=['Critical','High','Normal','Low'].map(k=>[k,o.filter(x=>x.priority===k).length]);else if(cfg.metric==='pm_state')pairs=[['Enabled',p.filter(x=>x.enabled).length],['Paused',p.filter(x=>!x.enabled).length]];else if(cfg.metric==='wo_site')pairs=(data.sites?.sites||[]).map(x=>[x.name,o.filter(w=>w.site_id===x.id).length]);else if(cfg.metric==='assets_status')pairs=[...new Set(assets().map(x=>x.status||'Unknown'))].map(k=>[k,assets().filter(x=>(x.status||'Unknown')===k).length]);else pairs=['New','Assigned','In Progress','On Hold','Completed','Closed'].map(k=>[k,o.filter(x=>x.status===k).length]);const max=Math.max(1,...pairs.map(x=>x[1]));const total=pairs.reduce((a,b)=>a+b[1],0)||1;const colors=['#2876d6','#28a7a0','#e5a23e','#8061d7','#d75d72','#8296aa'];const type=['bar','pie','doughnut','line','area'].includes(cfg.type)?cfg.type:'bar';let visual;if(type==='pie'||type==='doughnut'){let acc=0;const stops=pairs.map(([_,n],j)=>{const begin=acc;acc+=n/total*100;return `${colors[j%colors.length]} ${begin}% ${acc}%`}).join(',');visual=`<div class="chart-round" style="background:conic-gradient(${stops||'#e2e8f0 0% 100%'})">${type==='doughnut'?'<span>'+pairs.reduce((n,x)=>n+x[1],0)+'</span>':''}</div>`}else if(type==='line'||type==='area'){const pts=pairs.map((x,j)=>`${10+j*280/Math.max(1,pairs.length-1)},${112-x[1]/max*94}`).join(' ');visual=`<svg class="chart-line" viewBox="0 0 300 125" role="img" aria-label="${esc(cfg.title||cfg.metric)}"><polyline points="${pts}" fill="none" stroke="#2876d6" stroke-width="3" stroke-linejoin="round"/>${pairs.map((x,j)=>`<circle cx="${10+j*280/Math.max(1,pairs.length-1)}" cy="${112-x[1]/max*94}" r="4" fill="#2876d6"/>`).join('')}</svg>`}else visual=`<div class="pulse-bars">${pairs.map(([k,n])=>`<div class="pulse-bar-row"><span>${esc(k)}</span><div class="pulse-track"><div style="width:${n/max*100}%"></div></div><strong>${n}</strong></div>`).join('')}</div>`;return `<div class="panel"><div class="panelhead"><h2>${esc(cfg.title||'Maintenance Analytics')}</h2><span class="pill">${esc(type)}</span></div>${visual}<div class="chart-legend">${pairs.map(([k,n],j)=>`<span><i style="background:${colors[j%colors.length]}"></i>${esc(k)}: ${n}</span>`).join('')}</div></div>`}).join('')}</div>`}
async function saveChartPreference(){settings.charts=document.getElementById('chartToggle').checked;settings.chartConfigs=[{type:document.getElementById('chartType').value,metric:document.getElementById('chartMetric').value}];try{await post('workspace',settings);toast('Dashboard preference saved');render()}catch(e){toast(e.message)}}
function calendarPage(){const items=[...orders().filter(x=>x.pm_due_date||x.created_at).map(x=>({date:(x.pm_due_date||x.created_at||'').slice(0,10),label:x.title,type:'WO',id:x.id})),...pms().filter(x=>x.next_due).map(x=>({date:x.next_due.slice(0,10),label:x.title,type:'PM',id:x.id}))].filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));const month=window.pulseCalendarMonth||new Date().toISOString().slice(0,7);const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();const cells=Array.from({length:first+days},(_,i)=>i<first?'':String(i-first+1));return `<div class="panel"><div class="panelhead"><h2>Maintenance Calendar</h2><div><button class="btn secondary" onclick="shiftCalendar(-1)">←</button> <strong>${new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</strong> <button class="btn secondary" onclick="shiftCalendar(1)">→</button></div></div><div class="pulse-calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="pulse-day-head">${x}</div>`).join('')}${cells.map(d=>`<div class="pulse-day">${d?`<strong>${d}</strong>${items.filter(x=>x.date===month+'-'+d.padStart(2,'0')).slice(0,4).map(x=>`<div class="pulse-event" title="${esc(x.label)}">${x.type}: ${esc(x.label)}</div>`).join('')}`:''}</div>`).join('')}</div><h3>Upcoming maintenance</h3>${items.filter(x=>x.date>=new Date().toISOString().slice(0,10)).slice(0,20).map(x=>`<div class="row"><strong>${esc(x.date)}</strong> ${esc(x.type)} — ${esc(x.label)}</div>`).join('')||empty('No upcoming activities recorded.')}</div>`}
function shiftCalendar(delta){const month=window.pulseCalendarMonth||new Date().toISOString().slice(0,7);const [y,m]=month.split('-').map(Number);window.pulseCalendarMonth=new Date(y,m-1+delta,1).toISOString().slice(0,7);render()}
function supportPage(){const tickets=data['support/tickets']?.tickets||[],articles=data['support/articles']?.articles||[];return `<div class="two"><div class="panel"><h2>Open a Support Ticket</h2><p>Report an issue, request a feature, or ask a question.</p><form id="supportForm" onsubmit="submitSupport(event)"><div class="field"><label>Category</label><select name="kind"><option>Issue</option><option>Feature Request</option><option>Question</option></select></div><div class="field"><label>Priority</label><select name="priority"><option>Normal</option><option>Low</option><option>High</option></select></div><div class="field"><label>Subject</label><input name="title" required maxlength="180"></div><div class="field"><label>Details</label><textarea name="description" required rows="5"></textarea></div><button class="btn" type="submit">Submit Ticket</button></form><h2 style="margin-top:28px">My Tickets</h2>${tickets.map(t=>`<button type="button" class="ticket-item" onclick="openTicket('${esc(t.id)}')"><span><strong>${esc(t.id)} — ${esc(t.title)}</strong><small>${esc(t.kind)} · ${esc(t.created_at||'')}</small></span>${pill(t.status)}</button>`).join('')||empty('No support tickets yet.')}</div><div class="panel"><h2>Technical Knowledge Base</h2><p>Step-by-step instructions for common PULSE tasks and troubleshooting.</p><input id="kbSearch" placeholder="Search help articles" oninput="filterKB()" style="width:100%;padding:12px;border:1px solid #d6e0ea;border-radius:9px"><div id="kbResults">${articles.map(x=>`<details class="pulse-article"><summary>${esc(x.title)} <small>${esc(x.category)}</small></summary><p style="white-space:pre-line;line-height:1.8">${esc(x.body)}</p></details>`).join('')||empty('No articles loaded. An administrator should apply migration 0008.')}</div></div></div>`}
async function submitSupport(event){event.preventDefault();const b=Object.fromEntries(new FormData(event.target));try{const r=await post('support/tickets',b);toast('Ticket '+r.id+' created');await refresh();render()}catch(e){toast(e.message)}}
async function openTicket(id){try{const r=await api('support/tickets/'+encodeURIComponent(id));const t=r.ticket,comments=r.comments||[];drawer('Ticket '+id,`<div class="panel"><h2>${esc(t.title)}</h2><p>${pill(t.status)} ${esc(t.priority)} priority · ${esc(t.kind)}</p><p style="white-space:pre-line">${esc(t.description)}</p><h3>Support conversation</h3>${comments.map(c=>`<div class="row"><div><strong>${esc(c.author_name||'Support')}</strong><small>${esc(c.created_at)}</small><p style="white-space:pre-line">${esc(c.message)}</p></div></div>`).join('')||empty('No replies yet.')}<form id="ticketReply"><div class="field"><label>Add a comment</label><textarea name="message" required maxlength="5000"></textarea></div><div class="formfooter"><button class="btn" type="submit">Send Comment</button></div></form></div>`);document.getElementById('ticketReply').onsubmit=async e=>{e.preventDefault();try{await post('support/tickets/'+encodeURIComponent(id)+'/comments',Object.fromEntries(new FormData(e.target)));closeDrawer();await openTicket(id)}catch(err){toast(err.message)}}}catch(e){toast(e.message)}}
function filterKB(){const q=document.getElementById('kbSearch').value.toLowerCase();document.querySelectorAll('.pulse-article').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')}
function migrationPage(){return `<div class="panel"><h2>Migration Studio</h2><p>Choose your legacy CMMS to prepare an import. Supported export formats vary by product and version.</p><div class="formgrid"><div class="field"><label>Source system</label><select id="migrationSource">${cmss.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Record type</label><select id="migrationKind"><option value="assets">Assets</option><option value="orders">Work Orders</option><option value="pm">Preventive Maintenance</option></select></div><div class="field full"><label>CSV export file</label><input type="file" id="migrationFile" accept=".csv,text/csv"></div></div><button class="btn" onclick="previewMigration()">Inspect Export</button><div id="migrationPreview"></div></div>`}
async function previewMigration(){const source=document.getElementById('migrationSource').value,file=document.getElementById('migrationFile').files[0],target=document.getElementById('migrationPreview');if(!file){target.textContent='Select a CSV file.';return}const text=await file.text(),header=text.split(/\r?\n/)[0]||'';target.innerHTML=`<div class="panel"><h3>Export preview</h3><p><strong>Source:</strong> ${esc(source)}</p><p><strong>Columns:</strong> ${esc(header)}</p><p><strong>Estimated rows:</strong> ${Math.max(0,text.split(/\r?\n/).filter(Boolean).length-1)}</p><p class="muted">Preview only: no data has been imported. Vendor-specific mapping and validated import are not yet available in this build. Do not import unverified data into production.</p></div>`}

function openCreateForm(kind){let title=kind==='orders'?'Create Work Order':kind==='pm'?'Create Preventive Maintenance':'Register Asset';detail={form:kind};const common=`<div class="formsection"><h2>Work Details</h2><p>Define the maintenance activity and expected outcome.</p><div class="formgrid"><div class="field full"><label>Title *</label><input name="title" required placeholder="e.g. Inspect supply fan bearings"></div><div class="field full"><label>Scope of work / instructions</label><textarea name="description" placeholder="Describe required work, inspection steps and safety considerations"></textarea></div><div class="field"><label>Priority</label><select name="priority">${['Normal','Low','High','Critical'].map(x=>`<option>${x}</option>`).join('')}</select></div>${kind==='orders'?'<div class="field"><label>Work type</label><select name="work_type"><option>Corrective</option><option>Inspection</option><option>Emergency</option><option>Preventive</option></select></div>':''}</div></div>`;const assignment=`<div class="formsection"><h2>Assignment & Location</h2><p>Connect the work to the right person and equipment.</p><div class="formgrid"><div class="field"><label>Assigned technician</label><select name="assigned_to">${options(data['users/assignable']?.users,'id','name')}</select></div><div class="field"><label>Site</label><select name="site_id">${options(data.sites?.sites,'id','name')}</select></div><div class="field"><label>Asset ${kind==='pm'?'*':''}</label><select name="${kind==='pm'?'asset_code':'asset'}" ${kind==='pm'?'required':''}>${options(data.assets?.assets,'code','name')}</select></div>${kind==='orders'?'<div class="field"><label>Location / Area</label><input name="location" placeholder="Building, floor or zone"></div>':''}</div></div>`;const schedule=`<div class="formsection"><h2>Recurrence & Scheduling</h2><p>Work orders are generated automatically for activated PMs.</p><div class="formgrid"><div class="field"><label>Frequency unit</label><select name="schedule_unit"><option value="day">Days</option><option value="week">Weeks</option><option value="month" selected>Months</option><option value="year">Years</option></select></div><div class="field"><label>Repeat every</label><input name="schedule_interval" type="number" min="1" max="365" value="1" required></div><div class="field"><label>First due date *</label><input name="next_due" type="date" required></div></div><p class="tiny">Examples: every 2 weeks, every 3 months (quarterly), every 6 months, or every year. PMs start paused until activated.</p></div>`;const assetForm=`<div class="formsection"><h2>Equipment Identification</h2><div class="formgrid"><div class="field"><label>Site</label><select name="site_id">${options(data.sites?.sites,'id','name')}</select></div><div class="field"><label>Asset code *</label><input name="code" required></div><div class="field"><label>Asset name *</label><input name="name" required></div><div class="field"><label>Location</label><input name="location"></div><div class="field"><label>Manufacturer</label><input name="manufacturer"></div><div class="field"><label>Model</label><input name="model"></div><div class="field"><label>Serial number</label><input name="serial_number"></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div></div></div>`;drawer(title,`<form id="createForm">${kind==='assets'?assetForm:common+assignment+(kind==='pm'?schedule:'')}<div class="formfooter"><button type="button" class="btn secondary" onclick="closeDrawer()">Cancel</button><button class="btn">${kind==='pm'?'Create PM Draft':'Create '+(kind==='orders'?'Work Order':'Asset')}</button></div></form>`);document.getElementById('createForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));const save=e.target.querySelector('button[type="submit"]')||e.target.querySelector('.formfooter .btn:last-child');if(save)save.disabled=true;try{await post(kind,b);closeDrawer();await refresh();render();toast('Record created successfully')}catch(err){console.error('PULSE save failure',kind,err);toast('Unable to save: '+err.message)}finally{if(save)save.disabled=false}}}
function drawer(title,html){const el=document.createElement('div');el.id='drawerOverlay';el.className='overlay';el.innerHTML=`<div class="drawer"><div class="head"><div><div class="eyebrow">PULSE / WORKSPACE</div><h1>${esc(title)}</h1></div><button class="btn secondary" onclick="closeDrawer()">✕</button></div>${html}</div>`;document.body.append(el)}function closeDrawer(){document.getElementById('drawerOverlay')?.remove()}
async function detailRecord(kind,id){const rows=kind==='orders'?orders():kind==='pm'?pms():assets(),r=rows.find(x=>x.id===id);if(!r)return;let html=`<div class="panel"><h2>${esc(r.title||r.name)}</h2><p>${esc(r.description||'No description supplied.')}</p>${Object.entries(r).filter(([k,v])=>v!==null&&!['description','password_hash','salt'].includes(k)).slice(0,28).map(([k,v])=>`<div class="row"><span class="muted">${esc(k.replaceAll('_',' '))}</span><strong>${esc(v)}</strong></div>`).join('')}</div>`;if(kind==='orders')html+=`<div class="formsection"><h2>Update Work Order</h2><div class="formgrid"><div class="field"><label>Status</label><select id="woStatus">${['New','Assigned','In Progress','On Hold','Completed','Closed'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Assigned technician</label><select id="woAssignee">${options(data['users/assignable']?.users,'id','name')}</select></div></div><div class="formfooter"><button class="btn" onclick="updateWO('${esc(id)}')">Save Changes</button></div></div>`;drawer(r.title||r.name,html);if(kind==='orders')document.getElementById('woAssignee').value=r.assigned_to||''}
async function updateWO(id){try{await post('orders/'+id,{status:document.getElementById('woStatus').value,assigned_to:document.getElementById('woAssignee').value},'PATCH');closeDrawer();await refresh();render();toast('Work order updated')}catch(e){toast(e.message)}}async function togglePM(id,enabled){try{await post('pm/'+id,{enabled},'PATCH');await refresh();render();toast(enabled?'PM activated':'PM paused')}catch(e){toast(e.message)}}async function saveReport(){try{await post('reports',{name:document.getElementById('reportName').value,source:reportSource});await refresh();render();toast('Report saved')}catch(e){toast(e.message)}}function exportCSV(){const rows=reportSource==='orders'?orders():reportSource==='pm'?pms():assets();if(!rows.length)return toast('No records to export');const cols=Object.keys(rows[0]);const csv=[cols,...rows.map(r=>cols.map(k=>String(r[k]??'').replaceAll('"','""')))].map(r=>r.map(v=>'"'+v+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pulse-'+reportSource+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function signout(){try{await post('logout',{})}catch{}user=null;await auth()}function go(p){page=p;render()}
// PULSE v1 foundation: delegated handlers survive dashboard re-renders.
document.addEventListener('click',event=>{
 const create=event.target.closest('[data-create]');
 if(create){event.preventDefault();try{openCreateForm(create.dataset.create)}catch(error){console.error('PULSE create form',error);toast('Unable to open form: '+error.message)}return}
 if(event.target.closest('#openSetup')){event.preventDefault();openSetupGuide()}
});
function setupKey(){return 'pulse-setup-v1-'+String(user?.company_id||'unknown')}
function setupState(){try{return JSON.parse(localStorage.getItem(setupKey())||'{}')}catch{return {}}}
function setSetupStep(step){const v=setupState();v[step]=true;localStorage.setItem(setupKey(),JSON.stringify(v));openSetupGuide()}
function openSetupGuide(){
 if(!user)return;
 const sites=data.sites?.sites||[],assetsList=data.assets?.assets||[],plans=data.pm?.pm||[];
 const saved=setupState();
 const stages=[
 {id:'company',title:'Company workspace',description:'Your PULSE company account is active.',done:true,action:''},
 {id:'site',title:'Add your first facility',description:'Create a site so maintenance records can be organized by location.',done:sites.length>0,action:user.role==='admin'?'<button type="button" class="btn" id="wizardSite">Add facility</button>':'<span class="muted">Administrator access required</span>'},
 {id:'asset',title:'Register equipment',description:'Create your first asset with a unique equipment code.',done:assetsList.length>0,action:'<button type="button" class="btn" data-wizard-create="assets">Add asset</button>'},
 {id:'pm',title:'Create a maintenance schedule',description:'Create a preventive maintenance draft for an existing asset.',done:plans.length>0,action:'<button type="button" class="btn" data-wizard-create="pm">Create PM</button>'},
 {id:'wo',title:'Create your first work order',description:'Start assigning and tracking maintenance activity.',done:(data.orders?.orders||[]).length>0,action:'<button type="button" class="btn" data-wizard-create="orders">Create work order</button>'},
 {id:'team',title:'Review your team',description:'Check users and site access in Settings → Company Administration.',done:!!saved.team,action:'<button type="button" class="btn secondary" data-setup-done="team">Mark reviewed</button>'},
 {id:'ready',title:'Review workspace preferences',description:'Configure navigation, dashboard widgets and appearance in Settings.',done:!!saved.ready,action:'<button type="button" class="btn secondary" data-setup-done="ready">Mark reviewed</button>'}
 ];
 const count=stages.filter(x=>x.done).length;
 const markup=`<div class="panel" style="margin-bottom:18px;background:var(--soft)"><div class="eyebrow">GUIDED ONBOARDING</div><h2 style="margin-top:8px">${count} of ${stages.length} steps complete</h2><p>Set up PULSE using your real workspace data. Existing records are preserved.</p><div style="height:9px;background:var(--line);border-radius:12px;overflow:hidden"><div style="width:${Math.round(count/stages.length*100)}%;height:100%;background:var(--blue)"></div></div></div>`+stages.map((x,i)=>`<div class="row" style="align-items:flex-start"><div style="display:flex;gap:13px"><span class="pill ${x.done?'':'warn'}">${x.done?'✓':i+1}</span><div><strong>${x.title}</strong><small>${x.description}</small></div></div><div>${x.done?'<span class="pill">Complete</span>':x.action}</div></div>`).join('')+`<p class="tiny">This setup guide is an onboarding aid. Completing it does not certify production security or commercial readiness.</p>`;
 drawer('Welcome to PULSE by REYLEX',markup);
 const overlay=document.getElementById('drawerOverlay');
 overlay.addEventListener('click',async event=>{
  const button=event.target.closest('[data-wizard-create], [data-setup-done], #wizardSite');if(!button)return;
  if(button.dataset.setupDone){setSetupStep(button.dataset.setupDone);return}
  if(button.dataset.wizardCreate){const kind=button.dataset.wizardCreate;closeDrawer();try{openCreateForm(kind)}catch(e){toast(e.message)}return}
  if(button.id==='wizardSite'){
   closeDrawer();drawer('Add your first facility',`<form id="setupSiteForm"><div class="field"><label>Facility name *</label><input name="name" required maxlength="150" placeholder="Main Plant"></div><div class="field"><label>Site code *</label><input name="code" required pattern="[A-Za-z0-9_-]+" maxlength="40" placeholder="MAIN"></div><div class="field"><label>Address</label><input name="address" maxlength="250"></div><div class="formfooter"><button type="button" class="btn secondary" id="setupBack">Back</button><button class="btn" type="submit">Create facility</button></div></form>`);
   document.getElementById('setupBack').onclick=()=>{closeDrawer();openSetupGuide()};
   document.getElementById('setupSiteForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));const submit=e.target.querySelector('[type=submit]');submit.disabled=true;try{await post('sites',b);await refresh();closeDrawer();openSetupGuide();toast('Facility created')}catch(err){toast(err.message)}finally{submit.disabled=false}};
  }
 });
}

init();
</script></body></html>
