<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULSE | JELIX</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;color:#eaf0f7;background:#0a101a}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.5}input,textarea,select{background:#111c2b;color:#f4f7fc;border:1px solid #2b3c50;border-radius:10px;padding:12px;width:100%}textarea{min-height:100px;resize:vertical}label{font-size:12px;color:#9fb0c5;display:block;margin:14px 0 6px}.btn{background:#4c9cff;color:#06111e;padding:12px 17px;border-radius:10px;font-weight:750}.ghost{background:#1b293a;color:#dce9f8;padding:11px 15px;border-radius:10px}.link{color:#80b9ff;background:none;padding:0}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#0d1622;border-right:1px solid #233042;padding:25px 17px;display:flex;flex-direction:column;gap:6px}.brand{font-size:28px;font-weight:850;letter-spacing:3px;padding:10px 12px 32px}.brand span{color:#60a9ff}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#7489a4;margin-top:5px}.nav{padding:13px;border-radius:11px;color:#a8bbd0;text-align:left;background:transparent}.nav.active,.nav:hover{background:#172a42;color:white}.main{padding:34px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{color:#65a9fa;text-transform:uppercase;font-size:11px;letter-spacing:2px;font-weight:800}h1{font-size:31px;letter-spacing:-1px;margin:7px 0 8px}h2{font-size:18px;margin:0 0 16px}p,.muted{color:#96a9bf}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:30px 0}.card,.panel{background:#111d2b;border:1px solid #24354a;border-radius:16px;padding:22px}.metric{font-size:35px;font-weight:800;margin-top:14px}.metric-label{color:#9caec3;font-size:13px}.two{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}.item{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid #263448;padding:15px 0}.item:first-of-type{border-top:0}.pill{display:inline-block;border:1px solid #36516a;color:#b7d3ef;border-radius:100px;padding:5px 9px;font-size:11px;white-space:nowrap}.critical{color:#ff9b9b;border-color:#8a3f4c}.high{color:#ffd08b;border-color:#856138}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.hero{background:radial-gradient(circle at 50% 35%,#1d4872,#0b1727 55%,#0a101a);padding:10vw 8vw;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(48px,6vw,85px);letter-spacing:-4px}.auth{display:flex;align-items:center;justify-content:center;padding:28px}.auth .panel{width:100%;max-width:460px;padding:34px}.stack{display:grid;gap:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}.toolbar input{max-width:350px}.table-wrap{overflow:auto}.orders{width:100%;border-collapse:collapse;text-align:left}.orders th{font-size:11px;color:#8ca3be;text-transform:uppercase;letter-spacing:1px}.orders th,.orders td{padding:15px 12px;border-bottom:1px solid #27384c}.orders td{font-size:13px}.orders tr:hover td{background:#18283a}.orders tr{cursor:pointer}.modal-back{position:fixed;inset:0;background:#020710bb;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:#111e2d;border:1px solid #38506b;border-radius:18px;padding:28px;width:min(570px,100%);max-height:90vh;overflow:auto}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.error{color:#ff9c9c;font-size:13px}.success{color:#8fe1b0;font-size:13px}.mobile-top{display:none}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.login-wrap{grid-template-columns:1fr}.hero{padding:45px 30px}.hero h1{font-size:55px}.auth{padding:22px}.shell{grid-template-columns:1fr}.sidebar{display:none}.mobile-top{display:flex;gap:10px;overflow:auto;padding:12px;background:#0d1622}.main{padding:22px}.top{align-items:flex-start}}@media(max-width:540px){.metrics{gap:9px}.card{padding:16px}.metric{font-size:28px}.top{flex-direction:column}}

:root[data-theme="light"]{filter:none;color:#172638;background:#f4f7fb}:root[data-theme="light"] body{background:#f4f7fb;color:#172638}:root[data-theme="light"] .main{color:#172638}:root[data-theme="light"] .panel,:root[data-theme="light"] .card{background:#fff;border-color:#dbe3ed}:root[data-theme="light"] p,:root[data-theme="light"] .muted{color:#54677e}:root[data-theme="light"] input,:root[data-theme="light"] textarea,:root[data-theme="light"] select{background:#fff;color:#172638;border-color:#c7d4e3}:root[data-theme="light"] .orders td{border-color:#e2e8f0}:root[data-theme="hybrid"] body{background:#eef3f8;color:#172638}:root[data-theme="hybrid"] .main{color:#172638}:root[data-theme="hybrid"] .panel,:root[data-theme="hybrid"] .card{background:#fff;border-color:#dbe3ed}:root[data-theme="hybrid"] p,:root[data-theme="hybrid"] .muted{color:#54677e}:root[data-theme="hybrid"] input,:root[data-theme="hybrid"] textarea,:root[data-theme="hybrid"] select{background:#fff;color:#172638;border-color:#c7d4e3}:root[data-theme="hybrid"] .orders td{border-color:#e2e8f0}:root[data-theme="light"] .sidebar{background:#e2eaf4}:root[data-theme="light"] .sidebar .nav{color:#32445a}:root[data-theme="light"] .sidebar .brand{color:#172638}:root[data-theme="light"] .sidebar .nav.active{background:#cadbed;color:#152a43}:root[data-density="compact"] .panel,:root[data-density="compact"] .card{padding:14px}:root[data-density="spacious"] .panel,:root[data-density="spacious"] .card{padding:32px}

/* PULSE v0.3 premium login: intentionally independent of workspace theme */
.login-wrap{grid-template-columns:minmax(0,1.08fr) minmax(420px,.92fr);background:#f5f7fb;color:#15263a}
.login-wrap .hero{position:relative;overflow:hidden;padding:clamp(42px,7vw,112px);background:radial-gradient(ellipse at 78% 20%,#1a426b 0%,transparent 50%),linear-gradient(145deg,#091524,#11243a 65%,#0a1627);color:#f8fbff;isolation:isolate}
.login-wrap .hero:before{content:'';position:absolute;inset:0;z-index:-1;opacity:.25;background:repeating-linear-gradient(135deg,transparent 0 70px,#2e6792 71px,transparent 72px)}
.login-wrap .hero:after{content:'';position:absolute;width:540px;height:540px;border:1px solid #4175a566;border-radius:50%;right:-220px;bottom:-270px;box-shadow:0 0 0 65px #234e6b22,0 0 0 130px #234e6b1a;z-index:-1}
.login-wrap .hero h1{font-size:clamp(62px,7vw,110px);letter-spacing:-6px;margin:25px 0 10px;color:#fff}
.login-wrap .hero h2{font-size:clamp(24px,3vw,38px);letter-spacing:-1.2px;line-height:1.15;max-width:520px;color:#fff}
.login-wrap .hero p{font-size:16px;line-height:1.7;max-width:450px;color:#b3c9df}
.login-wrap .auth{background:#f5f7fb;padding:clamp(20px,5vw,65px)}
.login-wrap .auth .panel{max-width:490px;border:1px solid #e1e8f0;background:#fff;color:#142438;box-shadow:0 24px 70px #1d344516;border-radius:22px;padding:clamp(26px,4vw,48px)}
.login-wrap .auth .panel h1{color:#12283f;font-size:34px;letter-spacing:-1.3px}
.login-wrap .auth .panel p{color:#65788d;line-height:1.5}
.login-wrap .auth label{color:#41546a;font-weight:650}
.login-wrap .auth input,.login-wrap .auth textarea{background:#f8fafc;border:1px solid #d6e0eb;color:#142438;border-radius:11px}
.login-wrap .auth input:focus,.login-wrap .auth textarea:focus{outline:2px solid #8bbcff;outline-offset:1px}
.login-wrap .auth .btn{background:#2178d8;color:#fff;border-radius:11px;min-height:49px}
.login-wrap .auth .link{color:#1b68bb;font-weight:650;text-align:left}
.login-wrap .auth .eyebrow{color:#2478cc}
.login-wrap .auth .error{color:#b72539}
.login-wrap .auth .success{color:#167447}
.auth-footer{display:flex;gap:14px;flex-wrap:wrap;margin-top:25px;padding-top:22px;border-top:1px solid #e4ebf2}
.auth-brandline{font-size:12px;font-weight:750;letter-spacing:2.3px;color:#9bc6f4}
.auth-trust{margin-top:40px;color:#8eacc9;font-size:12px;letter-spacing:.4px}
@media(max-width:900px){.login-wrap{grid-template-columns:1fr}.login-wrap .hero{padding:45px 30px}.login-wrap .hero h1{font-size:60px;margin:12px 0}.login-wrap .hero h2{font-size:26px}.login-wrap .hero p{font-size:14px}.login-wrap .auth{padding:26px 16px}}
</style><style>.asset-shade{position:fixed;inset:0;background:#07111dcc;display:flex;align-items:flex-start;justify-content:center;z-index:9999;overflow:auto;padding:28px}.asset-dialog{background:#142338;color:#eaf0f7;border:1px solid #38506d;border-radius:18px;padding:26px;width:min(780px,100%);max-height:calc(100vh - 56px);overflow:auto}.asset-dialog .card{padding:14px}.asset-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.asset-row{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:12px;width:100%;background:transparent;color:inherit;border-bottom:1px solid #34465b;padding:15px 8px}.asset-row:hover{background:#24405a}.asset-dialog a{color:#8fc5ff}@media(max-width:700px){.asset-cols{grid-template-columns:1fr}.asset-shade{padding:8px}.asset-dialog{max-height:calc(100vh - 16px)}}</style></head><body><div id="app"></div><script>
const app=document.getElementById('app');let me=null,orders=[],users=[],assets=[],equipment=[],page='dashboard',modal=null,authView='login',notice='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',data){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},credentials:'same-origin',body:data?JSON.stringify(data):undefined});let j=await r.json().catch(()=>({error:'Server error'}));if(!r.ok)throw Error(j.error||'Request failed');return j}
const field=(name,label,required=true,type='text',value='')=>`<label>${label}${required?' *':''}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}>`;
function formData(f){return Object.fromEntries(new FormData(f).entries())}
function alertMsg(msg,error=false){notice=(error?'Error: ':'')+msg;render()}
function auth(){let outside=authView==='outside',setup=authView==='setup';app.innerHTML=`<div class="login-wrap"><section class="hero"><div class="auth-brandline">JELIX  /  OPERATIONS SUITE</div><h1>PULSE<span style="color:#60a9ff">.</span></h1><h2>Maintenance in motion.</h2><p>One clear view of work, assets and operational priorities. Built for the people who keep facilities running.</p><div class="auth-trust">WORK ORDERS &nbsp;·&nbsp; ASSET INTELLIGENCE &nbsp;·&nbsp; PREVENTIVE MAINTENANCE</div></section><section class="auth"><div class="panel"><div class="eyebrow">${outside?'PUBLIC MAINTENANCE REQUEST':setup?'INITIAL ADMIN SETUP':'SECURE WORKSPACE'}</div><h1>${outside?'Report an issue':setup?'Create administrator':'Welcome back'}</h1><p>${outside?'Submit a maintenance request without signing in. It becomes a new work order automatically.':setup?'Set up the first administrator account.':'Sign in to your maintenance command center.'}</p>${notice?`<p class="${notice.startsWith('Error:')?'error':'success'}">${esc(notice)}</p>`:''}<form id="authForm">${outside?`${field('name','Your name')}${field('email','Email address',true,'email')}${field('location','Building / location')}${field('title','Issue summary')}<label>Describe the issue *</label><textarea name="description" required></textarea><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">`:setup?`${field('name','Full name')}${field('company_id','Company ID',true,'text','pulse-demo')}${field('username','Username')}${field('email','Recovery email',true,'email')}${field('password','Password',true,'password')}`:`${field('company_id','Company ID',true,'text','pulse-demo')}${field('username','Username')}${field('password','Password',true,'password')}`}<div style="margin-top:23px"><button class="btn" style="width:100%">${outside?'Submit maintenance request':setup?'Create admin account':'Sign in'}</button></div></form><div class="auth-footer"><button class="link" onclick="authView='outside';notice='';render()">Submit maintenance request</button><button class="link" onclick="authView='login';notice='';render()">Staff sign in</button></div></div></section></div>`;document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const b=formData(e.target);try{if(outside){let r=await api('ticket','POST',b);notice='Request received. Work order '+r.id+' created.';authView='outside';render()}else if(setup){await api('setup','POST',b);authView='login';notice='Administrator created. Sign in with your new credentials.';render()}else{let r=await api('login','POST',b);me=r.user;notice='';try{await load()}catch(loadError){console.error('PULSE dashboard load failed',loadError);notice='Signed in, but dashboard data could not load: '+loadError.message}render()}}catch(err){alertMsg(err.message,true)}}}
const navs=[['dashboard','Command Center'],['orders','Work Orders'],['assets','Assets'],['pm','Preventive Maintenance'],['sites','Sites'],['audit','Audit Trail'],['requests','Request Intake'],['migration','Migration Studio'],['settings','Administration'],['team','Team & Access']];
function dashboard(){let open=orders.filter(x=>!['Completed','Closed'].includes(x.status)),crit=open.filter(x=>x.priority==='Critical'),high=open.filter(x=>x.priority==='High');return `<div class="eyebrow">FACILITY OVERVIEW</div><h1>Maintenance Command</h1><p>Your operational priorities, without the noise.</p><div class="metrics"><div class="card"><div class="metric-label">Active work orders</div><div class="metric">${open.length}</div></div><div class="card"><div class="metric-label">Critical priority</div><div class="metric">${crit.length}</div></div><div class="card"><div class="metric-label">High priority</div><div class="metric">${high.length}</div></div><div class="card"><div class="metric-label">Completed</div><div class="metric">${orders.length-open.length}</div></div></div><div class="two"><div class="panel"><div class="top"><h2>Attention Queue</h2><button class="ghost" onclick="go('orders')">View all →</button></div>${open.length?open.sort((a,b)=>(['Critical','High','Normal','Low'].indexOf(a.priority)-['Critical','High','Normal','Low'].indexOf(b.priority))).slice(0,7).map(o=>`<div class="item"><div><b>${esc(o.title)}</b><div class="muted" style="font-size:12px;margin-top:5px">${esc(o.id)} · ${esc(o.location||'No location')}</div></div><span class="pill ${o.priority.toLowerCase()}">${esc(o.priority)}</span></div>`).join(''):'<p>No active work orders yet.</p>'}</div><div class="panel"><h2>Operations Snapshot</h2><p>Outside requests automatically enter the work order queue as <b>New</b>.</p><div class="item"><span>Outside requests</span><b>${orders.filter(o=>o.source==='Outside Request').length}</b></div><div class="item"><span>In progress</span><b>${orders.filter(o=>o.status==='In Progress').length}</b></div><div class="item"><span>On hold</span><b>${orders.filter(o=>o.status==='On Hold').length}</b></div><div style="margin-top:20px"><button class="btn" onclick="openModal('create')">+ New work order</button></div></div></div>`}
function orderTable(data){return `<div class="table-wrap"><table class="orders"><thead><tr><th>Work order</th><th>Location</th><th>Priority</th><th>Status</th><th>Source</th><th>Created</th></tr></thead><tbody>${data.map(o=>`<tr onclick="openModal('${esc(o.id)}')"><td><b>${esc(o.title)}</b><div class="muted">${esc(o.id)}</div></td><td>${esc(o.location||'—')}</td><td><span class="pill ${o.priority.toLowerCase()}">${esc(o.priority)}</span></td><td>${esc(o.status)}</td><td>${esc(o.source)}</td><td>${esc(o.created_at?.slice(0,10))}</td></tr>`).join('')}</tbody></table>${data.length?'':'<p>No matching work orders.</p>'}</div>`}
function content(){if(page==='dashboard')return dashboard();if(page==='orders')return `<div class="eyebrow">WORK MANAGEMENT</div><div class="top"><div><h1>Work Orders</h1><p>Track each request from intake to closeout.</p></div><button class="btn" onclick="openModal('create')">+ Create work order</button></div><div class="toolbar"><input id="search" placeholder="Search orders, assets, locations..." oninput="filterOrders()"><select id="status" style="max-width:200px" onchange="filterOrders()"><option value="">All statuses</option>${['New','Assigned','In Progress','On Hold','Completed','Closed'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="panel" id="orderTable">${orderTable(orders)}</div>`;if(page==='migration')return migrationView();if(page==='settings')return settingsView();if(page==='requests')return `<div class="eyebrow">INTAKE CHANNEL</div><h1>Request Intake</h1><p>Maintenance tickets submitted by outside users automatically create work orders.</p><div class="panel">${orderTable(orders.filter(o=>o.source==='Outside Request'))}</div>`;if(page==='assets')return assetsView();if(page==='pm')return pmCenter();if(page==='sites')return sitesCenter();if(page==='audit')return auditCenter();return `<div class="eyebrow">ADMINISTRATION</div><h1>Team & Access</h1><p>Role-based accounts for administrators, managers, supervisors, technicians and viewers.</p>${me.role==='admin'?`<button class="btn" onclick="openModal('user')">+ Add team member</button><div class="panel" style="margin-top:20px">${users.map(u=>`<div class="item"><div><b>${esc(u.name)}</b><div class="muted">${esc(u.username)} · ${esc(u.email)}</div></div><span class="pill">${esc(u.role)}</span></div>`).join('')}</div>`:'<div class="panel">Only administrators can manage team accounts.</div>'}`}
function render(){if(!me){auth();return}app.innerHTML=`<div class="mobile-top">${navs.map(([id,t])=>`<button class="ghost" onclick="go('${id}')">${t}</button>`).join('')}</div><div class="shell"><aside class="sidebar"><div class="brand">PULSE<span>.</span><small>BY JELIX</small></div>${navs.map(([id,t])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}<div style="margin-top:auto;padding:15px"><div style="font-weight:700">${esc(me.name)}</div><div class="muted" style="font-size:12px">${esc(me.role)}</div><button class="link" style="margin-top:14px" onclick="logout()">Sign out</button></div></aside><main class="main"><div class="top" style="margin-bottom:35px"><div class="eyebrow">JELIX / PULSE CMMS</div><div class="muted">Operations workspace · v0.5</div></div>${notice?`<p class="success">${esc(notice)}</p>`:''}${content()}</main></div>${modal?modalHtml():''}`;if(modal)bindModal()}
function settingsView(){return `<div class="eyebrow">PERSONALIZATION</div><h1>Administration Center</h1><p>Company controls, appearance, team access, sites, PM schedules and audit history.</p><div class="toolbar"><button class="ghost" onclick="go('sites')">Sites & Locations</button><button class="ghost" onclick="go('team')">Users & Roles</button><button class="ghost" onclick="go('pm')">PM Configuration</button><button class="ghost" onclick="go('audit')">Audit Trail</button></div><div class="panel"><h2>Workspace theme</h2><div class="toolbar">${['hybrid','dark','light'].map(x=>`<button class="${(localStorage.pulseTheme||'hybrid')===x?'btn':'ghost'}" onclick="setTheme('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><label>Display density</label><select onchange="localStorage.pulseDensity=this.value;applyTheme()"><option value="comfortable">Comfortable</option><option value="compact" ${localStorage.pulseDensity==='compact'?'selected':''}>Compact</option><option value="spacious" ${localStorage.pulseDensity==='spacious'?'selected':''}>Spacious</option></select></div>`}
function setTheme(x){localStorage.pulseTheme=x;applyTheme();render()}
function applyTheme(){document.documentElement.dataset.theme=localStorage.pulseTheme||'hybrid';document.documentElement.dataset.density=localStorage.pulseDensity||'comfortable'}

let selectedAsset=null;
function assetsView(){return `<div class="eyebrow">ASSET MANAGEMENT / EQUIPMENT INTELLIGENCE</div><div class="top"><div><h1>Asset Registry</h1><p>One asset record, connected to a reusable equipment model, documents, PMs and work history.</p></div><button class="btn" onclick="showAssetForm()">+ Add asset</button></div><div class="metrics"><div class="card"><div class="metric-label">Registered assets</div><div class="metric">${assets.length}</div></div><div class="card"><div class="metric-label">Equipment models</div><div class="metric">${equipment.length}</div></div><div class="card"><div class="metric-label">Out of service</div><div class="metric">${assets.filter(a=>a.status==='Out of Service').length}</div></div></div><div class="panel"><div class="top"><h2>Equipment Library</h2><button class="ghost" onclick="showEquipmentForm()">+ Add equipment model</button></div><p>Manufacturer/model records share documentation across identical assets.</p>${equipment.length?equipment.map(e=>`<div class="item"><div><b>${esc(e.manufacturer)} ${esc(e.model)}</b><div class="muted">${esc(e.category||'Equipment model')}</div></div><span class="pill">${assets.filter(a=>a.equipment_model_id===e.id).length} assets</span></div>`).join(''):'<p class="muted">No equipment models yet.</p>'}</div><div class="panel" style="margin-top:20px"><h2>Assets</h2><div class="toolbar"><input placeholder="Filter by asset ID, name, location, model" oninput="filterAssetList(this.value)"></div><div id="assetList">${assetListHtml(assets)}</div></div>`}
function assetListHtml(rows){return rows.length?rows.map(a=>`<button class="asset-row" onclick="openAsset('${esc(a.id)}')"><div><b>${esc(a.code)} · ${esc(a.name)}</b><div class="muted">${esc([a.site,a.building,a.system_name,a.location].filter(Boolean).join(' / ')||'Location not assigned')} · ${esc([a.manufacturer||a.library_manufacturer,a.model].filter(Boolean).join(' ')||'No model')}</div></div><span class="pill">${esc(a.status)}</span></button>`).join(''):'<p class="muted">No assets found. Add your first asset.</p>'}
function filterAssetList(q){q=q.toLowerCase();document.getElementById('assetList').innerHTML=assetListHtml(assets.filter(a=>[a.code,a.name,a.location,a.site,a.building,a.system_name,a.manufacturer,a.model].join(' ').toLowerCase().includes(q)))}
function assetOverlay(inner){const old=document.getElementById('assetOverlay');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div id="assetOverlay" class="asset-shade"><section class="asset-dialog"><button class="ghost" style="float:right" onclick="document.getElementById('assetOverlay').remove()">Close ✕</button>${inner}</section></div>`)}
function showEquipmentForm(){assetOverlay(`<div class="eyebrow">EQUIPMENT LIBRARY</div><h2>Add equipment model</h2><p>Reusable manufacturer information for identical equipment.</p><form onsubmit="saveEquipment(event)">${field('manufacturer','Manufacturer')}${field('model','Model number')}${field('category','Equipment category',false)}<label>Notes</label><textarea name="description"></textarea><div class="toolbar"><button class="btn">Save equipment model</button></div></form>`)}
async function saveEquipment(ev){ev.preventDefault();try{await api('equipment','POST',formData(ev.target));await loadAssets();document.getElementById('assetOverlay').remove();render()}catch(e){alert(e.message)}}
function showAssetForm(){assetOverlay(`<div class="eyebrow">ASSET REGISTRY</div><h2>Add new asset</h2><form onsubmit="saveAsset(event)">${field('code','Asset ID')}${field('name','Asset name')}<label>Link equipment model (optional)</label><select name="equipment_model_id"><option value="">No linked model</option>${equipment.map(e=>`<option value="${esc(e.id)}">${esc(e.manufacturer)} ${esc(e.model)}</option>`).join('')}</select><div class="asset-cols"><div>${field('manufacturer','Manufacturer',false)}</div><div>${field('model','Model',false)}</div><div>${field('serial_number','Serial number',false)}</div><div>${field('site','Site',false)}</div><div>${field('building','Building',false)}</div><div>${field('system_name','System',false)}</div></div>${field('location','Specific location',false)}<label>Condition</label><select name="status"><option>Operational</option><option>Under Maintenance</option><option>Out of Service</option><option>Retired</option></select><label>Notes</label><textarea name="description"></textarea><div class="toolbar"><button class="btn">Create asset</button></div></form>`)}
async function saveAsset(ev){ev.preventDefault();try{await api('assets','POST',formData(ev.target));await loadAssets();document.getElementById('assetOverlay').remove();render()}catch(e){alert(e.message)}}
async function openAsset(id){try{const d=await api('assets/'+encodeURIComponent(id));selectedAsset=d;assetOverlay(assetProfile(d))}catch(e){alert(e.message)}}
function assetProfile(d){const a=d.asset,model=equipment.find(e=>e.id===a.equipment_model_id),make=model?.manufacturer||a.manufacturer,number=model?.model||a.model;return `<div class="eyebrow">ASSET PROFILE</div><h2>${esc(a.code)} · ${esc(a.name)}</h2><p>${esc([a.site,a.building,a.system_name,a.location].filter(Boolean).join(' / '))}</p><div class="asset-cols"><div class="card"><div class="metric-label">Status</div><b>${esc(a.status)}</b></div><div class="card"><div class="metric-label">Equipment model</div><b>${esc(make||'—')} ${esc(number||'')}</b></div><div class="card"><div class="metric-label">Serial</div><b>${esc(a.serial_number||'—')}</b></div></div><h3>Equipment Intelligence · Documentation</h3><p>Use manufacturer/model discovery links, then review and approve the exact document URL. PULSE does not claim a match until a person approves it.</p><div class="toolbar"><button class="ghost" onclick="searchManuals('${esc(make)}','${esc(number)}')">Search manufacturer manuals ↗</button>${model?`<button class="btn" onclick="showDocumentForm()">+ Approve document</button>`:'<span class="muted">Link an equipment library model to share manuals.</span>'}</div>${d.documents.length?d.documents.map(x=>`<div class="item"><div><b>${esc(x.document_type)} · ${esc(x.title)}</b><div class="muted">${esc(x.revision||'Revision unspecified')} · Approved by staff</div></div><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Open ↗</a></div>`).join(''):'<p class="muted">No approved manuals attached.</p>'}<h3>Maintenance history</h3>${d.history.length?d.history.map(x=>`<div class="item"><b>${esc(x.title)}</b><span>${esc(x.status)}</span></div>`).join(''):'<p class="muted">No work orders linked to this asset.</p>'}<h3>Preventive Maintenance</h3><button class="ghost" onclick="showPMForm()">+ Draft PM</button>${d.pmPlans.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.frequency)}</div></div><span class="pill">${x.enabled?'Active':'Draft · Disabled'}</span></div>`).join('')||'<p class="muted">No PMs linked.</p>'}`}
function searchManuals(make,model){if(!make||!model)return alert('Add manufacturer and model first.');window.open('https://www.google.com/search?q='+encodeURIComponent(make+' '+model+' site:'+('')+' operating installation troubleshooting manual PDF'),'_blank','noopener,noreferrer')}
function showDocumentForm(){const a=selectedAsset.asset;assetOverlay(`<div class="eyebrow">DOCUMENT APPROVAL</div><h2>Attach verified manual</h2><p>${esc(a.name)} · Applies to all assets linked to this equipment model.</p><form onsubmit="saveDocument(event)">${field('title','Document title')}<label>Document type</label><select name="document_type"><option>Operating Manual</option><option>Installation Manual</option><option>Troubleshooting Manual</option><option>Service Manual</option><option>Parts Catalog</option><option>Wiring Diagram</option><option>Datasheet</option></select>${field('url','Verified HTTPS URL',true,'url')}${field('revision','Revision / publication date',false)}<p class="muted">Confirm manufacturer, exact model and revision before approving.</p><button class="btn">Approve and attach</button></form>`)}
async function saveDocument(ev){ev.preventDefault();try{await api('equipment/documents','POST',{...formData(ev.target),equipment_model_id:selectedAsset.asset.equipment_model_id});await openAsset(selectedAsset.asset.id)}catch(e){alert(e.message)}}
function showPMForm(){assetOverlay(`<div class="eyebrow">PREVENTIVE MAINTENANCE</div><h2>Create draft PM</h2><p>Drafts stay disabled until reviewed. Use verified manufacturer instructions.</p><form onsubmit="savePM(event)">${field('title','PM title')}${field('frequency','Frequency / interval',false)}${field('next_due','Proposed next due date',false,'date')}<label>Tasks / instructions and source reference</label><textarea name="description"></textarea><button class="btn">Save disabled PM draft</button></form>`)}
async function savePM(ev){ev.preventDefault();try{await api('pm/draft','POST',{...formData(ev.target),asset_code:selectedAsset.asset.code});await openAsset(selectedAsset.asset.id)}catch(e){alert(e.message)}}
async function loadAssets(){let [a,e]=await Promise.all([api('assets'),api('equipment')]);assets=a.assets;equipment=e.equipment}
const migrationFields={assets:['external_id','title','location','description'],orders:['external_id','title','description','asset_code','location','status','priority','created_at'],pm:['external_id','title','asset_code','frequency','next_due','description']};
const aliases={external_id:['id','asset code','asset number','work order code','work order number','wo code','sm code','scheduled maintenance code','code','strcode'],title:['name','asset name','work order description','description','title','strname'],description:['long description','details','notes','strdescription'],asset_code:['asset code','asset','equipment code','equipment'],location:['location','site','building'],status:['status','work order status'],priority:['priority','priority level'],created_at:['created date','date created','created at'],frequency:['frequency','interval','schedule'],next_due:['next due','next scheduled date','next due date']};
let migration={kind:'assets',rows:[],headers:[],mapping:{},validated:[],result:null};
function migrationView(){if(!['admin','manager'].includes(me.role))return '<div class="panel">Migration Studio requires manager or administrator access.</div>';return `<div class="eyebrow">DATA PORTABILITY / FIIX</div><h1>Migration Studio</h1><p>Bring your assets, work orders and preventive maintenance history into PULSE.</p><div class="panel"><h2>1. Select Fiix export type</h2><select id="migKind" onchange="migration.kind=this.value;migration.rows=[];migration.headers=[];render()">${[['assets','Assets'],['orders','Work orders'],['pm','Scheduled maintenance / PMs']].map(([v,l])=>`<option value="${v}" ${migration.kind===v?'selected':''}>${l}</option>`).join('')}</select><p>For complete history, import assets first, then work orders, then scheduled maintenance.</p><h2>2. Upload CSV export</h2><input type="file" accept=".csv,text/csv" onchange="readMigrationFile(this.files[0])" />${migration.headers.length?`<h2 style="margin-top:24px">3. Map source columns</h2>${migrationFields[migration.kind].map(k=>`<label>${k}${['external_id','title'].includes(k)||(migration.kind==='pm'&&k==='asset_code')?' *':''}</label><select id="map_${k}" onchange="migration.mapping['${k}']=this.value"><option value="">Not mapped</option>${migration.headers.map(h=>`<option value="${esc(h)}" ${migration.mapping[k]===h?'selected':''}>${esc(h)}</option>`).join('')}</select>`).join('')}<div class="toolbar"><button class="btn" onclick="validateMigration()">Validate and preview</button></div>`:''}</div>${migration.validated.length?`<div class="panel" style="margin-top:20px"><h2>4. Review before importing</h2><p>${migration.validated.length} records parsed. ${migration.validated.filter(x=>x.error).length} invalid rows.</p><div class="table-wrap"><table class="orders"><thead><tr><th>Source ID</th><th>Title</th><th>Validation</th></tr></thead><tbody>${migration.validated.slice(0,50).map(x=>`<tr><td>${esc(x.external_id)}</td><td>${esc(x.title)}</td><td>${esc(x.error||'Ready')}</td></tr>`).join('')}</tbody></table></div><div class="toolbar"><button class="btn" onclick="importMigration()">Import valid records</button></div></div>`:''}${migration.result?`<div class="panel" style="margin-top:20px"><h2>Import result</h2><p>${esc(JSON.stringify(migration.result))}</p></div>`:''}`}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
async function readMigrationFile(file){if(!file)return;if(file.size>5e6){alert('Maximum CSV file size is 5 MB per upload');return}let parsed=parseCSV((await file.text()).replace(/^\uFEFF/,''));migration.headers=parsed.shift()||[];migration.rows=parsed.slice(0,10000);migration.mapping={};for(let k of migrationFields[migration.kind]){let options=[k.replaceAll('_',' '),...(aliases[k]||[])];migration.mapping[k]=migration.headers.find(h=>options.includes(h.trim().toLowerCase()))||''}migration.validated=[];migration.result=null;render()}
function validateMigration(){migration.validated=migration.rows.map((row,i)=>{let o={};for(let k of migrationFields[migration.kind]){let idx=migration.headers.indexOf(migration.mapping[k]);o[k]=idx>=0?(row[idx]||'').trim():''}o.error=!o.external_id||!o.title||(migration.kind==='pm'&&!o.asset_code)?'Required field missing':'';return o});migration.result=null;render()}
async function importMigration(){let valid=migration.validated.filter(r=>!r.error);if(!valid.length)return alert('No valid records');if(!confirm('Import '+valid.length+' records into PULSE? Existing Fiix IDs will be skipped.'))return;let result={inserted:0,skipped:0,errors:[]};try{for(let i=0;i<valid.length;i+=100){let r=await api('migration/import','POST',{source:'Fiix',kind:migration.kind,records:valid.slice(i,i+100)});result.inserted+=r.inserted;result.skipped+=r.skipped;result.errors.push(...r.errors)}migration.result=result;await load();render()}catch(e){alert(e.message)}}
function filterOrders(){const q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('status').value;document.getElementById('orderTable').innerHTML=orderTable(orders.filter(o=>(!s||o.status===s)&&[o.title,o.id,o.asset,o.location,o.description].join(' ').toLowerCase().includes(q)))}
async function load(){let r=await api('orders');orders=r.orders;if(me.role==='admin'){try{users=(await api('users')).users}catch{users=[]}}}
function go(p){page=p;notice='';if(p==='assets'||p==='pm'){loadAssets().then(()=>p==='pm'?loadPM().then(render):render()).catch(e=>{alert('Asset module requires migration 0004: '+e.message);render()})}else render()}function openModal(x){modal=x;render()}function closeModal(){modal=null;render()}
function modalHtml(){let o=orders.find(x=>x.id===modal),create=modal==='create',user=modal==='user';return `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="eyebrow">${user?'ADMINISTRATION':create?'NEW WORK ORDER':'WORK ORDER DETAILS'}</div><h1>${user?'Add team member':create?'Create work order':esc(o?.id||'')}</h1><form id="modalForm">${user?`${field('name','Name')}${field('username','Username')}${field('email','Recovery email',true,'email')}${field('password','Temporary password',true,'password')}<label>Role</label><select name="role">${['technician','supervisor','manager','viewer','admin'].map(x=>`<option>${x}</option>`).join('')}</select>`:create?`${field('title','Work order title')}<label>Description</label><textarea name="description"></textarea>${field('location','Location',false)}${field('asset','Asset',false)}<label>Priority</label><select name="priority">${['Normal','Low','High','Critical'].map(x=>`<option>${x}</option>`).join('')}</select>`:`<h2>${esc(o.title)}</h2><p>${esc(o.description||'No description')}</p><div class="item"><span>Location</span><b>${esc(o.location||'—')}</b></div><div class="item"><span>Asset</span><b>${esc(o.asset||'—')}</b></div><div class="item"><span>Requester</span><b>${esc(o.requester_name||'—')}</b></div><label>Status</label><select name="status">${['New','Assigned','In Progress','On Hold','Completed','Closed'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>${field('assigned_to','Assigned to',false,'text',o.assigned_to)}`}<div class="actions"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button class="btn">${user?'Create account':create?'Create order':'Save changes'}</button></div></form></div></div>`}
function bindModal(){document.getElementById('modalForm').onsubmit=async e=>{e.preventDefault();try{const b=formData(e.target);if(modal==='create')await api('orders','POST',b);else if(modal==='user')await api('users','POST',b);else await api('orders/'+modal,'PATCH',b);modal=null;await load();notice='Saved successfully';render()}catch(err){window.alert(err.message)}}}
async function logout(){await api('logout','POST');me=null;authView='login';notice='';render()}
(async()=>{try{const s=await api('setup-status');if(s.needsSetup)authView='setup';else{try{me=(await api('me')).user;await load()}catch{}}}catch(e){notice='Error: '+e.message}applyTheme();render()})();

let pmRecords=[],siteRecords=[],auditRecords=[];
async function loadPM(){pmRecords=(await api('pm')).pm}
async function loadSites(){siteRecords=(await api('sites')).sites}
async function loadAudit(){auditRecords=(await api('audit')).events}
function pmCenter(){return `<div class="eyebrow">SCHEDULED MAINTENANCE</div><div class="top"><div><h1>Preventive Maintenance</h1><p>Calendar-based schedules automatically generate work orders when due.</p></div><button class="btn" onclick="showPMCenterForm()">+ New PM</button></div><div class="metrics"><div class="card"><div class="metric-label">PM Plans</div><div class="metric">${pmRecords.length}</div></div><div class="card"><div class="metric-label">Active</div><div class="metric">${pmRecords.filter(p=>p.enabled).length}</div></div><div class="card"><div class="metric-label">Due / Overdue</div><div class="metric">${pmRecords.filter(p=>p.enabled&&p.next_due&&p.next_due<=new Date().toISOString().slice(0,10)).length}</div></div></div><div class="panel"><h2>Recurring PM schedules</h2>${pmRecords.length?pmRecords.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.asset_code)} · Every ${esc(x.schedule_interval||1)} ${esc(x.schedule_unit||x.frequency)} · Next: ${esc(x.next_due||'Unscheduled')}</div></div><button class="${x.enabled?'ghost':'btn'}" onclick="togglePM('${esc(x.id)}',${x.enabled?'false':'true'})">${x.enabled?'Pause':'Activate'}</button></div>`).join(''):'<p>No PM plans yet. Create your first schedule.</p>'}</div>`}
async function showPMCenterForm(){try{await loadAssets();await loadSites()}catch(e){alert(e.message);return}assetOverlay(`<div class="eyebrow">PREVENTIVE MAINTENANCE</div><h2>Create recurring PM</h2><p>New PMs start paused until activated. The hourly scheduler creates work orders when due.</p><form onsubmit="savePMCenter(event)">${field('title','PM title')}<label>Asset *</label><select name="asset_code" required>${assets.map(a=>`<option value="${esc(a.code)}">${esc(a.code)} · ${esc(a.name)}</option>`).join('')}</select><label>Site</label><select name="site_id"><option value="">Unassigned</option>${siteRecords.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><label>Recurrence *</label><select name="schedule_unit"><option value="day">Daily</option><option value="week">Weekly</option><option value="month" selected>Monthly</option><option value="year">Yearly</option></select>${field('schedule_interval','Repeat every (number)',true,'number','1')}${field('next_due','First due date',true,'date',new Date().toISOString().slice(0,10))}<label>Priority</label><select name="priority"><option>Normal</option><option>Low</option><option>High</option><option>Critical</option></select><label>Procedure / checklist</label><textarea name="description"></textarea><div class="toolbar"><button class="btn">Create paused PM</button></div></form>`)}
async function savePMCenter(e){e.preventDefault();try{await api('pm','POST',formData(e.target));document.getElementById('assetOverlay').remove();await loadPM();render()}catch(err){alert(err.message)}}
async function togglePM(id,enabled){try{await api('pm/'+id,'PATCH',{enabled});await loadPM();render()}catch(e){alert(e.message)}}
function sitesCenter(){loadSites().then(()=>{const el=document.getElementById('sitesList');if(el)el.innerHTML=siteRecords.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.code)} · ${esc(x.address)}</div></div></div>`).join('')||'<p>No sites yet.</p>'}).catch(e=>alert(e.message));return `<div class="eyebrow">MULTI-FACILITY</div><h1>Sites & Locations</h1><p>Manage facilities within your company.</p>${me.role==='admin'?`<div class="panel"><h2>Add Site</h2><form onsubmit="saveSite(event)">${field('code','Site code')}${field('name','Site name')}${field('address','Address',false)}<button class="btn">Create Site</button></form></div>`:''}<div class="panel" style="margin-top:20px"><h2>Registered Sites</h2><div id="sitesList">Loading…</div></div>`}
async function saveSite(e){e.preventDefault();try{await api('sites','POST',formData(e.target));await loadSites();render()}catch(err){alert(err.message)}}
function auditCenter(){if(!['admin','manager'].includes(me.role))return '<div class="panel">Audit trail requires manager access.</div>';loadAudit().then(()=>{let el=document.getElementById('auditList');if(el)el.innerHTML=auditRecords.map(a=>`<div class="item"><div><b>${esc(a.action)}</b><div class="muted">${esc(a.entity_type)} · ${esc(a.entity_id)} · ${esc(a.actor_name||'System')}</div></div><span class="muted">${esc(a.created_at)}</span></div>`).join('')||'<p>No audit events yet.</p>'}).catch(e=>alert(e.message));return `<div class="eyebrow">ACCOUNTABILITY</div><h1>Audit Trail</h1><p>Recorded changes to sites, work orders and preventive maintenance.</p><div class="panel" id="auditList">Loading…</div>`}
</script></body></html>
